<!--
  HOW TO RUN / چلانے کا طریقہ
  1. Save this file as index.html
  2. Double-click to open in any browser (works offline)
  3. Deploy: drag the file to netlify.com/drop, or push to GitHub and enable Pages.
  Customize: edit DEFAULT_TASKS, QUOTES and the :root colors below.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamza Flow – Daily TODO</title>
<style>
/* ---------- Theme colors (edit here) ---------- */
:root{--bg:#eef6f8;--card:#fff;--text:#12303a;--muted:#6a8791;--primary:#0e8f8a;--primary2:#1d6fd1;--border:#d6e5ea;--high:#e5484d;--med:#f5a524;--low:#2fb36d}
:root[data-theme=dark]{--bg:#0c1a20;--card:#13262e;--text:#e3f1f4;--muted:#8fb0ba;--border:#23404a}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Nastaliq Urdu",sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;padding:16px}
.wrap{max-width:760px;margin:auto;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 4px 16px #0000000d}
.hero{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:0}
.hero h1{font-size:clamp(1.2rem,4vw,1.7rem)}
.hero p{opacity:.9;margin-top:4px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;transition:transform .15s,opacity .2s}
button:hover{transform:translateY(-1px)}
.ghost{background:#ffffff30;color:#fff}
.btn{background:var(--primary);color:#fff}
.btn2{background:transparent;color:var(--text);border:1px solid var(--border)}
.bar{height:12px;background:#ffffff40;border-radius:99px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .5s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats b{font-size:1.5rem;color:var(--primary);display:block}
.stats span{font-size:.8rem;color:var(--muted)}
.quote{font-style:italic;color:var(--muted);text-align:center}
.form{display:grid;gap:10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
input,select,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.filters .tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab.on{background:var(--primary);color:#fff}
ul{list-style:none;padding:0;display:grid;gap:10px}
.task{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--border);border-left:5px solid var(--low);animation:in .35s}
.task.High{border-left-color:var(--high)}.task.Medium{border-left-color:var(--med)}
.task.done .t{text-decoration:line-through;opacity:.5}
.task.out{animation:out .3s forwards}
.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--primary);margin-top:2px}
.body{flex:1;min-width:0}
.t{font-weight:600}
.d{font-size:.88rem;color:var(--muted);margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:.75rem}
.tags span{background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:2px 9px}
.acts button{background:transparent;padding:4px 7px;font-size:1.05rem}
.empty{text-align:center;color:var(--muted);padding:30px}
dialog{border:0;border-radius:16px;padding:22px;background:var(--card);color:var(--text);max-width:340px;box-shadow:0 10px 40px #0006}
dialog::backdrop{background:#0008}
dialog .row{margin-top:16px}
.pc{position:fixed;top:-30px;font-size:1.6rem;pointer-events:none;animation:fall 2.8s linear forwards;z-index:99}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
@keyframes out{to{opacity:0;transform:translateX(40px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="wrap">

  <!-- Greeting + date + progress -->
  <section class="card hero">
    <div class="top">
      <div>
        <h1>Assalam-o-Alaikum, Ameer Hamza! 👋</h1>
        <p id="sub"></p><p id="date"></p>
      </div>
      <button class="ghost" id="theme" title="Dark / Light">🌙</button>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <p id="pct" style="font-size:.85rem"></p>
  </section>

  <!-- Counters -->
  <section class="card stats">
    <div><b id="nTotal">0</b><span>Total / کل</span></div>
    <div><b id="nDone">0</b><span>Completed / مکمل</span></div>
    <div><b id="nPend">0</b><span>Pending / باقی</span></div>
  </section>

  <section class="card quote" id="quote"></section>

  <!-- Add / Edit form -->
  <section class="card form">
    <input id="title" placeholder="Task title / کام کا عنوان *" maxlength="80">
    <textarea id="desc" rows="2" placeholder="Description (optional) / تفصیل"></textarea>
    <div class="row">
      <select id="cat">
        <option>🕌 Ibadah</option><option>📚 Learning</option><option>💼 Work</option>
        <option>💻 Practice</option><option>📱 Social Media</option>
      </select>
      <input id="time" placeholder="Time e.g. 9:00 AM - 10:00 AM">
      <select id="prio"><option>High</option><option selected>Medium</option><option>Low</option></select>
    </div>
    <div class="row">
      <button class="btn" id="save">➕ Add Task / شامل کریں</button>
      <button class="btn2" id="cancel" hidden>Cancel / منسوخ</button>
    </div>
  </section>

  <!-- Filters -->
  <section class="filters">
    <div class="tabs">
      <button class="btn2 tab on" data-f="all">All / سب</button>
      <button class="btn2 tab" data-f="active">Active / باقی</button>
      <button class="btn2 tab" data-f="done">Completed / مکمل</button>
    </div>
    <button class="btn2" id="reset">🔄 Daily Reset / نیا دن</button>
  </section>

  <ul id="list"></ul>
</div>

<!-- Delete confirmation -->
<dialog id="dlg">
  <p>Delete this task? / کیا یہ کام حذف کریں؟</p>
  <div class="row">
    <button class="btn2" id="no">No / نہیں</button>
    <button class="btn" id="yes" style="background:var(--high)">Delete / حذف</button>
  </div>
</dialog>

<script>
/* ---------- Default routine tasks (edit freely) ---------- */
const DEFAULT_TASKS=[
 {title:"Fajr Namaz / فجر کی نماز",desc:"Start the day with prayer",cat:"🕌 Ibadah",time:"Fajr time",prio:"High"},
 {title:"Web Development Class",desc:"Attend online class",cat:"📚 Learning",time:"9:00 AM - 10:00 AM",prio:"High"},
 {title:"Shop / دکان",desc:"Go to work",cat:"💼 Work",time:"10:00 AM - 7:00 PM",prio:"Medium"},
 {title:"English Language Class",desc:"Evening class",cat:"📚 Learning",time:"Night",prio:"High"},
 {title:"Web Dev Practice & Projects",desc:"Build something small every day",cat:"💻 Practice",time:"Evening / Night",prio:"Medium"},
 {title:"Upload on Social Media",desc:"Share today's progress",cat:"📱 Social Media",time:"Night",prio:"Low"}
];
const QUOTES=["Small steps every day lead to big results.","Don't watch the clock; do what it does — keep going.","Consistency beats talent when talent is lazy.","Build in public, learn in public.","The best time to start was yesterday. The next best is now."];

const $=id=>document.getElementById(id);
let tasks=[],filter="all",editId=null,delId=null;

/* ---------- Storage ---------- */
function load(){
  try{tasks=JSON.parse(localStorage.getItem("hf_tasks"))}catch(e){}
  if(!Array.isArray(tasks)){tasks=DEFAULT_TASKS.map(t=>({...t,id:uid(),done:false}));save()}
}
function save(){try{localStorage.setItem("hf_tasks",JSON.stringify(tasks))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Greeting, date, quote ---------- */
function header(){
  const h=new Date().getHours();
  const s=h<5?"🌙 Night — rest or study quietly":h<12?"🌅 Subha — Fajr & morning energy":h<17?"☀️ Afternoon — stay focused":h<20?"🌇 Evening — wrap up & practice":"🌙 Night — English class & practice";
  $("sub").textContent=s;
  $("date").textContent=new Date().toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  $("quote").textContent="“"+QUOTES[new Date().getDate()%QUOTES.length]+"”";
}

/* ---------- Render ---------- */
function render(){
  const done=tasks.filter(t=>t.done).length,total=tasks.length,p=total?Math.round(done/total*100):0;
  $("nTotal").textContent=total;$("nDone").textContent=done;$("nPend").textContent=total-done;
  $("fill").style.width=p+"%";$("pct").textContent=p+"% complete / مکمل";
  const shown=tasks.filter(t=>filter=="all"||(filter=="done"?t.done:!t.done));
  $("list").innerHTML=shown.length?shown.map(t=>`
   <li class="task ${t.prio} ${t.done?"done":""}" data-id="${t.id}">
     <input type="checkbox" ${t.done?"checked":""} data-a="toggle" aria-label="Complete">
     <div class="body">
       <div class="t">${esc(t.title)}</div>
       ${t.desc?`<div class="d">${esc(t.desc)}</div>`:""}
       <div class="tags"><span>${esc(t.cat)}</span>${t.time?`<span>⏰ ${esc(t.time)}</span>`:""}<span>${t.prio}</span></div>
     </div>
     <div class="acts"><button data-a="edit" title="Edit">✏️</button><button data-a="del" title="Delete">🗑️</button></div>
   </li>`).join(""):`<li class="empty card">📝 No tasks here yet.<br>یہاں ابھی کوئی کام نہیں۔</li>`;
}

/* ---------- Actions ---------- */
$("save").onclick=()=>{
  const title=$("title").value.trim();
  if(!title){$("title").focus();return}
  const data={title,desc:$("desc").value.trim(),cat:$("cat").value,time:$("time").value.trim(),prio:$("prio").value};
  if(editId){Object.assign(tasks.find(t=>t.id==editId),data)}
  else tasks.unshift({...data,id:uid(),done:false});
  clearForm();save();render();
};
function clearForm(){editId=null;["title","desc","time"].forEach(i=>$(i).value="");$("prio").value="Medium";$("save").textContent="➕ Add Task / شامل کریں";$("cancel").hidden=true}
$("cancel").onclick=clearForm;

$("list").onclick=e=>{
  const li=e.target.closest(".task");if(!li)return;
  const id=li.dataset.id,a=e.target.dataset.a,t=tasks.find(x=>x.id==id);
  if(a=="toggle"){t.done=!t.done;save();render();if(tasks.length&&tasks.every(x=>x.done))confetti()}
  if(a=="edit"){editId=id;$("title").value=t.title;$("desc").value=t.desc;$("cat").value=t.cat;$("time").value=t.time;$("prio").value=t.prio;
    $("save").textContent="💾 Save / محفوظ کریں";$("cancel").hidden=false;scrollTo({top:0,behavior:"smooth"});$("title").focus()}
  if(a=="del"){delId=id;$("dlg").showModal()}
};
$("no").onclick=()=>$("dlg").close();
$("yes").onclick=()=>{
  $("dlg").close();
  const li=document.querySelector(`[data-id="${delId}"]`);li&&li.classList.add("out");
  setTimeout(()=>{tasks=tasks.filter(t=>t.id!=delId);save();render()},280);
};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");filter=b.dataset.f;render()});
$("reset").onclick=()=>{if(confirm("Mark all tasks incomplete for a new day? / نئے دن کے لیے سب ری سیٹ کریں؟")){tasks.forEach(t=>t.done=false);save();render()}};

/* ---------- Dark mode ---------- */
function setTheme(t){document.documentElement.dataset.theme=t;$("theme").textContent=t=="dark"?"☀️":"🌙";try{localStorage.setItem("hf_theme",t)}catch(e){}}
$("theme").onclick=()=>setTheme(document.documentElement.dataset.theme=="dark"?"light":"dark");

/* ---------- Celebration ---------- */
function confetti(){
  const em=["🎉","✨","🌟","🎊","💚","💙"];
  for(let i=0;i<40;i++){const s=document.createElement("span");s.className="pc";s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),4000)}
}

/* ---------- Init ---------- */
let th;try{th=localStorage.getItem("hf_theme")}catch(e){}
setTheme(th||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
load();header();render();
</script>
</body>
</html>
